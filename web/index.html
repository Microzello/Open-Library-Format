<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Library Format</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>Open Library Format</h1>
        <p class="subtitle">Self-hosted media library</p>
      </div>
      <div class="library-picker">
        <label for="librarySelect">Library</label>
        <select id="librarySelect"></select>
        <button id="createLibraryBtn" class="primary">New Library</button>
      </div>
    </header>

    <main class="app-main">
      <section class="toolbar">
        <div class="toolbar-group">
          <button id="uploadBtn" class="primary">Upload</button>
          <input id="fileInput" type="file" multiple hidden />
          <button id="deleteSelectedBtn" class="danger" disabled>Delete Selected</button>
          <button id="downloadSelectedBtn" disabled>Download Selected</button>
        </div>
        <div class="toolbar-group filters">
          <input id="searchInput" type="search" placeholder="Search by filename" />
          <div class="tag-filter">
            <label for="tagFilter">Tags</label>
            <select id="tagFilter" multiple></select>
          </div>
          <div class="date-filter">
            <label>Taken from</label>
            <input id="takenFrom" type="date" />
          </div>
          <div class="date-filter">
            <label>Taken to</label>
            <input id="takenTo" type="date" />
          </div>
          <select id="sortSelect">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="taken">Taken date</option>
          </select>
        </div>
      </section>

      <section id="gallery" class="gallery"></section>
    </main>

    <div id="detailModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="closeModalBtn" class="close">×</button>
        <div class="modal-body">
          <div class="preview" id="detailPreview"></div>
          <div class="metadata">
            <h2 id="detailTitle"></h2>
            <dl id="metadataList"></dl>
            <div class="tag-editor">
              <label for="tagEditorInput">Tags</label>
              <input id="tagEditorInput" type="text" placeholder="Comma separated" />
              <div class="tag-editor-actions">
                <button id="saveTagsBtn" class="primary">Save Tags</button>
                <button id="deleteMediaBtn" class="danger">Delete</button>
                <button id="downloadMediaBtn">Download</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <template id="galleryItemTemplate">
      <article class="gallery-item">
        <div class="thumbnail"></div>
        <div class="item-footer">
          <span class="filename"></span>
          <div class="item-actions">
            <input type="checkbox" class="select-checkbox" />
            <button class="info-btn">Info</button>
          </div>
        </div>
      </article>
    </template>

    <script src="app.js" type="module"></script>
  </body>
</html>
